name: CI

on: [push, pull_request]

jobs:
  windows-msvc:
    strategy:
      matrix:
        arch: [x86, x64]
        compiler:
          - { cc: "cl", cxx: "cl" }
    runs-on: windows-latest
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Visual Studio developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
  windows-clang:
    strategy:
      matrix:
        arch:
          - { short: "x86", long: "i686" }
          - { short: "x64", long: "x86_64" }
        compiler:
          - { cc: "clang-cl", cxx: "clang-cl" }
          - { cc: "clang", cxx: "clang++" }
    runs-on: windows-latest
    env:
      CC: "${{ matrix.compiler.cc }} --target=${{ matrix.arch.long }}-pc-windows-msvc"
      CXX: "${{ matrix.compiler.cxx }} --target=${{ matrix.arch.long }}-pc-windows-msvc"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Visual Studio developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch.short }}
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
  windows-gcc:
    runs-on: windows-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: install libs
        run: sudo apt-get install libasound2-dev
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: install libs
        run: brew install flac libsndfile opus wavpack libsoxr ffmpeg
      - name: Configure
        run: cmake -B build -G Ninja .
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: |
          ./build/refalac --check
          ./build/qaac --check
          ./build/qaac --formats
          head -c 176400 /dev/zero > /tmp/smoke.raw
          ./build/refalac --raw -o /tmp/smoke_alac.m4a /tmp/smoke.raw
          ./build/qaac --raw -o /tmp/smoke_aac.m4a /tmp/smoke.raw
      - name: Show encoding application tag
        run: |
          ffprobe -hide_banner /tmp/smoke_alac.m4a
          ffprobe -hide_banner /tmp/smoke_aac.m4a
      - name: Set up Python
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install regression test deps
        if: matrix.arch == 'arm64'
        run: pip install numpy
      # arm64-only: the x86_64 (macos-26-intel) runner is much slower and
      # this test doesn't need architecture coverage to be meaningful.
      - name: AAC-LC/HE gapless + fidelity regression test
        if: matrix.arch == 'arm64'
        run: |
          set -e
          python3 test/regtest.py gen --sr 44100 --duration 2.0 --out /tmp/regtest_orig.wav
          # decode with qaac itself, not ffmpeg: ffmpeg's own MP4/AAC
          # gapless (edit list) handling is known incomplete -- see
          # test/regtest.py's module docstring for specifics.
          for container in mp4 caf; do
            cflag=""; ext="m4a"
            [ "$container" = "caf" ] && cflag="--caf" && ext="caf"
            for mode in lc he; do
              flag=""
              [ "$mode" = "he" ] && flag="--he"
              encoded=/tmp/regtest_${container}_${mode}.${ext}
              decoded=/tmp/regtest_${container}_${mode}_dec.wav
              ./build/qaac $flag $cflag --gapless-mode 2 -o "$encoded" /tmp/regtest_orig.wav
              ./build/qaac -D --bits-per-sample 16 -o "$decoded" "$encoded"
              python3 test/regtest.py check --mode $mode \
                --orig /tmp/regtest_orig.wav \
                --decoded "$decoded"
            done
          done
      - name: HE-AAC trailing-padding edge case regression test
        if: matrix.arch == 'arm64'
        run: |
          set -e
          # HE-AAC's SBR decoder delay (481 core-rate samples) means the
          # encoder's trailing padding must always be >= 481 core-rate
          # samples for a correct gapless roundtrip; CoreAudioToolbox's
          # encoder doesn't guarantee that on its own (CoreAudioPaddedEncoder
          # covers the gap). Sweep content lengths that land exactly on and
          # around that threshold, including the theoretical worst case
          # (0 samples of natural padding) -- see
          # samples_for_he_tail_padding()'s docstring in test/regtest.py.
          for container in mp4 caf; do
            cflag=""; ext="m4a"
            [ "$container" = "caf" ] && cflag="--caf" && ext="caf"
            for padding in 0 1 480 481 482; do
              orig=/tmp/regtest_pad_${padding}.wav
              python3 test/regtest.py gen --sr 44100 --he-tail-padding $padding --out "$orig"
              encoded=/tmp/regtest_pad_${container}_${padding}.${ext}
              decoded=/tmp/regtest_pad_${container}_${padding}_dec.wav
              ./build/qaac --he $cflag --gapless-mode 2 -o "$encoded" "$orig"
              ./build/qaac -D --bits-per-sample 16 -o "$decoded" "$encoded"
              python3 test/regtest.py check --mode he --orig "$orig" --decoded "$decoded"
            done
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qaac-macos-${{ matrix.arch }}
          path: |
            build/qaac
            build/refalac
  linux-clang-mingw:
    strategy:
      matrix:
        arch:
          - { short: "x86", triple: "i686-w64-mingw32" }
          - { short: "x64", triple: "x86_64-w64-mingw32" }
    runs-on: ubuntu-latest
    env:
      # https://github.com/mstorsjo/llvm-mingw/releases -- bump alongside the
      # UCRT variant (matches the UCRT mingw-w64/gcc already used by the
      # windows-gcc job) when a newer release is needed.
      LLVM_MINGW_VERSION: "20260616"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install llvm-mingw
        run: |
          dir="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${dir}.tar.xz"
          tar xf llvm-mingw.tar.xz
          echo "$PWD/$dir/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=${{ matrix.arch.triple }}-clang \
            -DCMAKE_CXX_COMPILER=${{ matrix.arch.triple }}-clang++ \
            .
      - name: Build
        run: cmake --build build
